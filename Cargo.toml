[package]
name = "neo-nexus"
version = "4.3.1"
edition = "2021"
license = "MIT"
authors = ["NeoNexus Team"]
description = "Pure Rust web workbench for Neo N3 node operations"

[lib]
name = "neo_nexus"
path = "src/lib.rs"

[[bin]]
name = "neo-nexus"
path = "src/main.rs"
test = false

[dependencies]
aes = { version = "0.8", features = ["zeroize"] }
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
crc32fast = "1.4"
dirs = "6"
ed25519-dalek = "2"
flate2 = "1"
fs2 = "0.4"
libc = "0.2"
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
ripemd = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
scrypt = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sysinfo = "0.38.4"
tar = "0.4"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["timeout"] }
ureq = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
log = "0.4"
chrono = "0.4"
reqwest = { version = "0.12", features = ["blocking"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
futures = "0.3"
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
hyper = { version = "1.0", features = ["server"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
axum = { version = "0.8", features = ["http1"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
