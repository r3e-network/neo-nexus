[advisories]
# Fail the build on any advisory the project has not explicitly vouched for.
yanked = "deny"
ignore = [
    # RUSTSEC-2024-0449: unsafe-libyaml is unmaintained (archived 2024-03), reached
    # only via `serde_yaml` 0.9, which is itself deprecated. The advisory carries no
    # known vulnerability — it is a maintenance warning. The parser only reads
    # repo-controlled CI workflow files and operator-provided local config files,
    # never remote input. The real fix is migrating to a maintained parser
    # (e.g. serde-saphyr); that touches ~26 files including the YAML generators and
    # is its own change. Until then this advisory is explicitly vouched for.
    "RUSTSEC-2024-0449",
]

[licenses]
version = 2
# The project is MIT-licensed and uses the usual permissive ecosystem licenses.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "MPL-2.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]
# Multiple explicit licenses in the metadata are fine; warn on them.
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
