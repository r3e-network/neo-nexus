log_format nexus_cloudflare escape=json
  '{"time":"$time_iso8601",'
  '"client_ip":"$http_cf_connecting_ip",'
  '"edge_ip":"$remote_addr",'
  '"request":"$request",'
  '"status":$status,'
  '"bytes":$body_bytes_sent,'
  '"request_time":$request_time,'
  '"referer":"$http_referer",'
  '"user_agent":"$http_user_agent",'
  '"request_id":"$request_id"}';
